<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div1 {
            background-color: blueviolet;
        }

        .div2 {
            background-color: bisque;
            padding: 10px 30px 50px 100px;
            border-top: 3px solid green;
            border-bottom: 3px solid green;
            border-right: 5px dotted purple;
            border-left: 10px dashed yellow;
            /*
            margin: 10px 30px 50px 100px; 
            Os códigos abaixo fazem o mesmo que o acima! 
            */
            margin-top: 10px;
            margin-right: 30px;
            margin-bottom: 50px;
            margin-left: 100px;
        }

        .div3 {
            background-color: brown;
        }
    </style>
</head>

<body>

    <div class="div1">Antes</div>
    <div class="div2">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Soluta cumque dignissimos reiciendis
        esse eaque ea repudiandae, laudantium ad et, id sint. Soluta dolorum tempore commodi, libero alias vel
        voluptatem facilis.</div>
    <div class="div3">Depois</div>

</body>

</html>
